name: Test and publish Koi Lune
on:
  push:
    branches: [main]
    paths:
      - '*.html'
      - '*.js'
      - '*.css'
      - 'package*.json'
      - 'assets/**'
      - 'tests/**'
      - '.github/workflows/pages.yml' 
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: koi-lune-pages
  cancel-in-progress: false
jobs:
  test-and-build:
    runs-on: ubuntu-24.04
    container: mcr.microsoft.com/playwright:v1.58.2-noble
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm test
      - name: Prepare static site
        run: |
          mkdir -p _site/assets
          cp index.html app.js engine.js data.js style.css _site/
          cp assets/* _site/assets/
          touch _site/.nojekyll
          node --input-type=module <<'JS'
          import { readFile, writeFile } from 'node:fs/promises';
          const version = process.env.GITHUB_SHA;
          for (const file of ['index.html', 'app.js', 'engine.js']) {
            const target = '_site/' + file;
            let content = await readFile(target, 'utf8');
            for (const asset of ['app.js', 'engine.js', 'data.js', 'style.css']) {
              content = content.replaceAll('./' + asset, './' + asset + '?v=' + version);
            }
            await writeFile(target, content);
          }
          JS
          node --check _site/app.js
          node --check _site/engine.js
      - run: npm run test:browser
        env:
          SITE_DIR: _site
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: koi-lune-test-results
          path: test-results/
          retention-days: 14
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: test-and-build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
